name: Publish encoded image
on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.b64'
permissions:
  contents: write
concurrency:
  group: morning-brief-art-writer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Decode, preserve and optimize images
        id: decode
        continue-on-error: true
        run: python scripts/decode_incoming.py
      - name: Commit valid images and failure report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- images/ .pipeline-status/
          if ! git diff --cached --quiet; then
            git commit -m "Publish encoded illustration"
            git push
          fi

      - name: Fail visibly if any input failed
        if: steps.decode.outcome == 'failure'
        run: exit 1
