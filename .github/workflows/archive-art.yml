name: Archive Morning Brief artwork

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public HTTPS URL of the generated image (PNG/JPEG/WebP)"
        required: true
        type: string
      brief_date:
        description: "Date in Australia/Brisbane (YYYY-MM-DD)"
        required: true
        type: string
      slug:
        description: "Short public-safe description (lowercase letters, numbers, hyphens)"
        required: true
        default: "daily-art"
        type: string

permissions:
  contents: write

concurrency:
  group: morning-art-${{ inputs.brief_date }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Download, validate and optimize for e-ink
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          BRIEF_DATE: ${{ inputs.brief_date }}
          SLUG: ${{ inputs.slug }}
        run: |
          python scripts/archive_image.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Archive Morning Brief illustration for ${{ inputs.brief_date }}"
            git push
          fi
      - name: Print public image URL
        env:
          BRIEF_DATE: ${{ inputs.brief_date }}
          SLUG: ${{ inputs.slug }}
        run: |
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/images/${BRIEF_DATE:0:4}/${BRIEF_DATE:5:2}/${BRIEF_DATE}-${SLUG}.png" >> "$GITHUB_STEP_SUMMARY"
